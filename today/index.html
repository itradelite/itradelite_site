<!doctype html>
<html lang="en-AU">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Today — iTradeLite Daily ASX Briefing</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-gold: #f59e0b;
            --brand-primary: #38bdf8;
            --mono-font: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Topbar Polish */
        .topbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 0;
        }
        .topbar__inner { display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; font-weight: 700; font-size: 18px; }

        /* Banner System */
        .banner {
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            border-left: 4px solid var(--border);
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .banner--riskon { border-left-color: var(--accent-green); background: linear-gradient(90deg, rgba(16,185,129,0.1) 0%, transparent 100%); }
        .banner--riskoff { border-left-color: var(--accent-red); background: linear-gradient(90deg, rgba(244,63,94,0.1) 0%, transparent 100%); }

        /* KPI Dashboard Grid */
        .kpiGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }
        .kpiBox {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .kpiLabel { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .kpiValue { font-family: var(--mono-font); font-size: 28px; font-weight: 500; margin-top: 8px; color: var(--brand-primary); }

        /* Control Bar */
        .controls {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 24px;
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        select, input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        select:focus, input:focus { border-color: var(--brand-primary); }

        /* Table Aesthetics */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 30px; }
        .sectionTitle { padding: 20px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
        .sectionTitle h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 14px 20px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .symbol-cell { font-family: var(--mono-font); font-weight: 600; color: var(--brand-primary); }
        .mono { font-family: var(--mono-font); font-size: 13px; }
        
        /* Status Pills */
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot--valid { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .dot--watch { background-color: var(--accent-gold); }

        .btn {
            background: var(--brand-primary);
            color: var(--bg);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn--ghost { background: transparent; border: 1px solid var(--border); color: white; }
        .btn:hover { opacity: 0.8; }

        @media (max-width: 768px) {
            .kpiGrid { grid-template-columns: 1fr 1fr; }
            .controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="container topbar__inner">
            <a class="brand" href="/">
                <img src="/assets/mark.svg" alt="" width="24" height="24" />
                <span>iTradeLite <span style="font-weight: 300; opacity: 0.6;">Briefing</span></span>
            </a>
            <nav style="display: flex; gap: 20px; font-size: 14px;">
                <a href="/today/" style="color: var(--brand-primary); text-decoration: none;">Today</a>
                <a href="/how-it-works.html" style="color: var(--text-muted); text-decoration: none;">Rules</a>
            </nav>
            <button class="btn btn--ghost" id="refreshBtn">Refresh Data</button>
        </div>
    </header>

    <main class="container">
        <div id="riskBanner"></div>
        
        <div class="kpiGrid">
            <div class="kpiBox">
                <div class="kpiLabel">Recommended</div>
                <div class="kpiValue" id="kpiRecommended">0</div>
            </div>
            <div class="kpiBox">
                <div class="kpiLabel">Valid Setups</div>
                <div class="kpiValue" id="kpiValid">0</div>
            </div>
            <div class="kpiBox">
                <div class="kpiLabel">Risk Regime</div>
                <div class="kpiValue" id="riskMode" style="font-size: 18px; text-transform: uppercase;">Loading...</div>
            </div>
            <div class="kpiBox">
                <div class="kpiLabel">Data Age</div>
                <div class="kpiValue" id="dataAge" style="font-size: 18px;">--</div>
            </div>
        </div>

        <section class="controls">
            <div class="field">
                <label>View Mode</label>
                <select id="viewMode">
                    <option value="all">All Sections</option>
                    <option value="recommended">Recommended Only</option>
                    <option value="valid">Valid Setups</option>
                </select>
            </div>
            <div class="field">
                <label>Strategy</label>
                <select id="strategyFilter">
                    <option value="all">All Strategies</option>
                </select>
            </div>
            <div class="field" style="flex-grow: 1;">
                <label>Search Symbol</label>
                <input id="q" placeholder="Search (e.g. CBA.AX)..." />
            </div>
            <div class="field">
                <label>Sort By</label>
                <select id="sortBy">
                    <option value="status_score">Status Rank</option>
                    <option value="score_desc">Highest Score</option>
                    <option value="symbol_asc">Alphabetical</option>
                </select>
            </div>
        </section>

        <div id="tables">
            </div>

        <footer style="padding: 40px 0; border-top: 1px solid var(--border); margin-top: 40px; color: var(--text-muted); font-size: 12px;">
            <p><b>Disclaimer:</b> Educational purpose only. iTradeLite is a rule-based algorithmic scanner. Trading involves significant risk of loss. Always consult a licensed professional.</p>
        </footer>
    </main>

  <script>
    const DATA_URL = "/public/today.json";

    // Persist UI preferences
    const prefs = { view:"all", strat:"all", q:"", sort:"status_score" };

    function loadPrefs(){
      try{
        const raw = localStorage.getItem("itradelite_today_prefs");
        if (!raw) return;
        const obj = JSON.parse(raw);
        Object.assign(prefs, obj || {});
      }catch(_){}
    }
    function savePrefs(){
      try{ localStorage.setItem("itradelite_today_prefs", JSON.stringify(prefs)); }catch(_){}
    }

    function fmt(n, digits=2){
      if (n === null || n === undefined || n === "") return "—";
      const x = Number(n);
      if (!Number.isFinite(x)) return String(n);
      return x.toFixed(digits);
    }

    function safeText(s){ return (s === null || s === undefined) ? "—" : String(s); }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function showError(msg){
      const box = document.getElementById("errorBox");
      box.textContent = msg;
      box.style.display = "block";
      setStatus(false, "Error");
    }
    function clearError(){
      const box = document.getElementById("errorBox");
      box.style.display = "none";
      box.textContent = "";
    }

    function setStatus(ok, text){
      const statusText = document.getElementById("statusText");
      const chip = document.getElementById("statusChip");
      statusText.textContent = text;
      chip.style.borderColor = ok ? "rgba(94,234,212,.35)" : "rgba(255,213,128,.35)";
      chip.style.background  = ok ? "rgba(94,234,212,.12)" : "rgba(255,213,128,.10)";
    }

    function computeDataAge(generatedAtUtc){
      if (!generatedAtUtc) return "—";
      const d = new Date(generatedAtUtc);
      if (isNaN(d.getTime())) return "—";
      const now = new Date();
      const mins = Math.round((now - d) / 60000);
      if (!isFinite(mins)) return "—";
      if (mins < 90) return mins + " min";
      return (mins / 60).toFixed(1) + " hrs";
    }

    function parseEntry(r){
      if (r.entry_text) return r.entry_text;
      if (r.entry !== null && r.entry !== undefined && r.entry !== "") return fmt(r.entry, 4);
      return "—";
    }
    function parseLastClose(r){
      if (r.last_close === null || r.last_close === undefined || r.last_close === "") return "—";
      const x = Number(r.last_close);
      if (!Number.isFinite(x)) return "—";
      return fmt(x, 4);
    }

    function parseRisk(r){
      if (r.risk === null || r.risk === undefined || r.risk === "") return "—";
      const x = Number(r.risk);
      if (!Number.isFinite(x)) return "—";
      return "~" + Math.round(x).toString();
    }

    function statusPill(status){
      if (status === "Valid") return `<span class="pill pill--valid">Valid</span>`;
      if (status === "Watch") return `<span class="pill pill--watch">Watch</span>`;
      return `<span class="pill">—</span>`;
    }

    function normalizeStrategyName(s){
      return (s || "").trim();
    }

    function scoreVal(r){
      const x = Number(r.score);
      return Number.isFinite(x) ? x : -1;
    }
    function riskVal(r){
      const x = Number(r.risk);
      return Number.isFinite(x) ? x : -1;
    }

    function buildTable(title, rows, subtitle){
      const count = rows.length;

      let html = `
        <section class="card card--pad">
          <div class="sectionTitle">
            <h2>${escapeHtml(title)}</h2>
            <div class="count">${escapeHtml(subtitle || (count + " item(s)"))}</div>
          </div>
          <div class="tableWrap">
            <table>
              <thead>
                <tr>
                  <th style="width:120px;">Symbol</th>
                  <th style="width:160px;">Strategy</th>
                  <th>Entry</th>
                  <th style="width:110px;">Last close</th>
                  <th style="width:110px;">Stop</th>
                  <th style="width:110px;">Risk (A$)</th>
                  <th style="width:90px;">Status</th>
                </tr>
              </thead>
              <tbody>
      `;

      for (const r of rows){
        const sym = escapeHtml(safeText(r.symbol));
        const strat = escapeHtml(normalizeStrategyName(r.strategy));
        const entry = escapeHtml(parseEntry(r));
        const lastClose = escapeHtml(parseLastClose(r));
        const stop = escapeHtml(fmt(r.stop, 2));
        const risk = escapeHtml(parseRisk(r));
        const pill = statusPill(r.status);

        // Optional: show instruction/note if present (future-ready)
        const note = r.plain_english || r.instruction || r.note || "";
        const noteHtml = note ? `<div class="rowNote">${escapeHtml(note)}</div>` : "";

        html += `
          <tr>
            <td class="mono"><b>${sym}</b>${noteHtml}</td>
            <td>${strat}</td>
            <td class="mono">${entry}</td>
            <td class="mono">${lastClose}</td>
            <td class="mono">${stop}</td>
            <td class="mono">${risk}</td>
            <td>${pill}</td>
          </tr>
        `;
      }

      html += `
              </tbody>
            </table>
          </div>
        </section>
      `;
      return html;
    }

    function hydrateStrategyOptions(allRows){
      const sel = document.getElementById("strategyFilter");
      const existing = new Set([...sel.options].map(o => o.value));
      const strategies = new Set(allRows.map(s => normalizeStrategyName(s.strategy)).filter(Boolean));
      const sorted = [...strategies].sort((a,b)=>a.localeCompare(b));
      for (const s of sorted){
        if (existing.has(s)) continue;
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        sel.appendChild(opt);
      }
    }

    function applyFilters(rows){
      let out = rows.slice();

      if (prefs.strat !== "all"){
        out = out.filter(r => normalizeStrategyName(r.strategy) === prefs.strat);
      }
      if (prefs.q){
        const q = prefs.q.toUpperCase();
        out = out.filter(r => String(r.symbol || "").toUpperCase().includes(q));
      }

      const statusRank = (st) => st === "Valid" ? 2 : (st === "Watch" ? 1 : 0);

      out.sort((a,b)=>{
        if (prefs.sort === "symbol_asc") return String(a.symbol||"").localeCompare(String(b.symbol||""));
        if (prefs.sort === "risk_desc")  return riskVal(b) - riskVal(a);
        if (prefs.sort === "score_desc") return scoreVal(b) - scoreVal(a);
        const ds = statusRank(b.status) - statusRank(a.status);
        if (ds !== 0) return ds;
        return scoreVal(b) - scoreVal(a);
      });

      return out;
    }

    function renderBanners(data){
      // Risk banner (institutional)
      const rb = document.getElementById("riskBanner");
      const rm = (data.risk_mode || "").toLowerCase();

      if (rm === "risk_on"){
        rb.innerHTML = `
          <div class="banner banner--riskon">
            <div><b>Risk Regime:</b> RISK-ON</div>
            <div class="pill pill--riskon">Trend + momentum setups enabled</div>
          </div>
        `;
      } else if (rm === "risk_off"){
        rb.innerHTML = `
          <div class="banner banner--riskoff">
            <div><b>Risk Regime:</b> RISK-OFF</div>
            <div class="pill pill--riskoff">Trend + momentum disabled</div>
          </div>
        `;
      } else {
        rb.innerHTML = "";
      }

      // Freshness banner (only if your today.json includes data_fresh=false)
      const fb = document.getElementById("freshBanner");
      if (data.data_fresh === false){
        fb.innerHTML = `
          <div class="banner banner--stale">
            <div>
              <b>Data freshness:</b> Yahoo daily bars not updated yet. Recommendations may be suppressed.
              <div class="muted" style="margin-top:4px;">This is a safety gate to avoid publishing stale signals.</div>
            </div>
            <div class="pill">STale</div>
          </div>
        `;
      } else {
        fb.innerHTML = "";
      }
    }

    function extractRecommendedRows(data){
      // Preferred: recommended_orders (from snapshot-based today.json)
      if (Array.isArray(data.recommended_orders)) return data.recommended_orders;

      // Backward-compatible fallback:
      // use setups with status === "Valid" as “actionable candidates”
      const setups = Array.isArray(data.setups) ? data.setups : [];
      return setups.filter(r => r.status === "Valid");
    }

    function render(data){
      clearError();

      document.getElementById("generated").textContent = safeText(data.generated || data.date);
      document.getElementById("validFor").textContent  = safeText(data.valid_for || data.date);
      document.getElementById("riskMode").textContent  = safeText(data.risk_mode || "—");
      document.getElementById("dataAge").textContent   = computeDataAge(data.generated_at_utc);

      // KPIs
      const setups = Array.isArray(data.setups) ? data.setups : [];
      const recommended = extractRecommendedRows(data);

      const validCount = setups.filter(s => s.status === "Valid").length;
      const watchCount = setups.filter(s => s.status === "Watch").length;

      document.getElementById("kpiRecommended").textContent = String(recommended.length);
      document.getElementById("kpiValid").textContent = String(validCount);
      document.getElementById("kpiWatch").textContent = String(watchCount);

      // Optional meta (future-ready: snapshot-derived today.json)
      document.getElementById("kpiUniverse").textContent = safeText(data.universe_size || "—");
      document.getElementById("kpiAxjo").textContent = safeText(data.axjo_last_bar || "—");

      renderBanners(data);
      setStatus(true, data.published === false ? "Not published" : "Loaded");

      // Strategy options should include both lists if recommended present
      hydrateStrategyOptions(setups.concat(recommended));

      // Build sections with filters applied
      const filteredSetups = applyFilters(setups);
      const filteredRecommended = applyFilters(recommended);

      const validRows = filteredSetups.filter(r => r.status === "Valid");
      const watchRows = filteredSetups.filter(r => r.status === "Watch");

      let html = "";

      // View mode routing
      if (prefs.view === "recommended"){
        if (filteredRecommended.length){
          html += buildTable("Recommended Orders", filteredRecommended, "Actionable (diversified picks)");
        } else {
          html += `<section class="card card--pad"><b>No recommended orders today.</b><div class="small">This can happen when freshness gate blocks publishing or when no setups pass the final filters.</div></section>`;
        }
      }
      else if (prefs.view === "valid"){
        if (validRows.length) html += buildTable("Valid Setups", validRows, validRows.length + " item(s)");
        else html += `<section class="card card--pad"><b>No valid setups match your filters.</b><div class="small">Try changing Strategy or clearing the search.</div></section>`;
      }
      else if (prefs.view === "watch"){
        if (watchRows.length) html += buildTable("Watchlist", watchRows, watchRows.length + " item(s)");
        else html += `<section class="card card--pad"><b>No watch items match your filters.</b><div class="small">Try changing Strategy or clearing the search.</div></section>`;
      }
      else {
        // All sections (institutional priority order)
        if (filteredRecommended.length){
          html += buildTable("Recommended Orders", filteredRecommended, "Actionable (diversified picks)");
        } else {
          // Only show a small institutional note if none
          html += `
            <section class="card card--pad">
              <div class="sectionTitle">
                <h2>Recommended Orders</h2>
                <div class="count">0 item(s)</div>
              </div>
              <div class="small">No recommended orders published today (freshness gate or no setups passed final selection).</div>
            </section>
          `;
        }

        if (validRows.length) html += buildTable("Valid Setups", validRows, validRows.length + " item(s)");
        if (watchRows.length) html += buildTable("Watchlist", watchRows, watchRows.length + " item(s)");

        if (!filteredRecommended.length && !validRows.length && !watchRows.length){
          html += `<section class="card card--pad"><b>No rows match your filters.</b><div class="small">Try changing View/Strategy or clearing search.</div></section>`;
        }
      }

      document.getElementById("tables").innerHTML = html;
    }

    async function load(){
      setStatus(false, "Loading…");
      const url = DATA_URL + "?v=" + Date.now();
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }

    function bindControls(){
      const viewMode = document.getElementById("viewMode");
      const strategyFilter = document.getElementById("strategyFilter");
      const q = document.getElementById("q");
      const sortBy = document.getElementById("sortBy");

      // init values
      viewMode.value = prefs.view;
      strategyFilter.value = prefs.strat;
      q.value = prefs.q;
      sortBy.value = prefs.sort;

      // Updated statusPill for the new look
      function statusPill(status) {
          if (status === "Valid") return `<span><span class="status-dot dot--valid"></span>Valid</span>`;
          if (status === "Watch") return `<span><span class="status-dot dot--watch"></span>Watch</span>`;
          return `<span class="muted">—</span>`;
      }


      function onChange(){
        prefs.view = viewMode.value;
        prefs.strat = strategyFilter.value;
        prefs.q = q.value.trim();
        prefs.sort = sortBy.value;
        savePrefs();
        if (window.__DATA__) render(window.__DATA__);
      }

      viewMode.addEventListener("change", onChange);
      strategyFilter.addEventListener("change", onChange);
      sortBy.addEventListener("change", onChange);
      q.addEventListener("input", onChange);

      document.getElementById("refreshBtn").addEventListener("click", async ()=>{
        try{
          const data = await load();
          window.__DATA__ = data;
          render(data);
        }catch(e){
          showError("Failed to load /public/today.json. (" + e.message + ")");
          console.error(e);
        }
      });

      document.getElementById("copyLinkBtn").addEventListener("click", async ()=>{
        const link = location.origin + DATA_URL;
        try{
          await navigator.clipboard.writeText(link);
          alert("Copied: " + link);
        }catch(_){
          prompt("Copy this URL:", link);
        }
      });
    }

    (async function(){
      loadPrefs();
      bindControls();

      try{
        const data = await load();
        window.__DATA__ = data;
        render(data);
      }catch(e){
        showError("Failed to load /public/today.json. (" + e.message + ")");
        console.error(e);
      }
    })();
  </script>
</body>
</html>

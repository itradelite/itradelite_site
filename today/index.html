<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Today — iTradeLite Daily ASX Briefing</title>

  <link rel="stylesheet" href="/assets/site.css?v=4" />

  <style>
    /* Institutional Terminal Overrides */
    :root {
      --accent-glow: rgba(59, 130, 246, 0.15);
      --mono: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', monospace;
    }

    body { background-color: var(--bg-deep); }

    /* Glass KPI Dashboard */
    .kpiGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .kpiBox {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .kpiBox::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.3;
    }
    .kpiBox:hover { border-color: var(--accent); transform: translateY(-2px); }
    .kpiLabel { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
    .kpiValue { font-family: var(--mono); font-size: 2rem; font-weight: 700; margin-top: 10px; color: #fff; }
    
    /* Control Panel Logic */
    .controls {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .field label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    select, input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: var(--mono);
      transition: border-color 0.2s;
    }
    select:focus, input:focus { border-color: var(--accent); outline: none; }

    /* Tables */
    .tableWrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .sectionTitle { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .sectionTitle h2 { margin: 0; font-size: 1.1rem; letter-spacing: -0.5px; color: #fff; }
    
    th { background: rgba(0,0,0,0.2); font-size: 0.65rem; letter-spacing: 1.5px; padding: 12px 20px; }
    td { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.85rem; }
    
    .symbol-cell { color: #fff; font-weight: 800; font-family: var(--mono); }
    .note-row td { background: rgba(59, 130, 246, 0.03); color: var(--text-muted); font-size: 0.8rem; padding-left: 40px; }

    /* Status Indicators */
    .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .dot--valid { background: var(--success); box-shadow: 0 0 10px var(--success); }
    .dot--watch { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }

    .pill { background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: var(--text-muted); font-family: var(--mono); }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="/">
        <img src="/assets/logo.png" alt="iTradeLite" style="height: 26px;">
        <span>iTradeLite <small style="opacity:0.5; font-weight:400; font-size: 0.7em;">TERMINAL</small></span>
      </a>
      <nav class="nav">
        <a href="/today/" aria-current="page">Dashboard</a>
        <a href="/how-it-works.html">Method</a>
        <a href="/about.html">About</a>
        <button class="btn btn--primary" id="refreshBtn" style="padding: 6px 14px; font-size: 0.75rem; margin-left: 10px;">Sync Data</button>
      </nav>
    </div>
  </header>

  <main class="container pagePad">
    <header style="margin-bottom: 40px;">
      <h1 style="font-size: 3rem; letter-spacing: -2px; margin-bottom: 8px; background: linear-gradient(to bottom right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Today's Briefing.</h1>
      <div style="display: flex; gap: 15px; align-items: center;">
        <span class="pill" id="generated">Data: Synchronizing...</span>
        <span class="pill" id="riskMode">Regime: —</span>
      </div>
    </header>

    
    <div class="kpiGrid">
      <div class="kpiBox">
        <div class="kpiLabel">Recommended Picks</div>
        <div class="kpiValue" id="kpiRecommended">0</div>
      </div>
      <div class="kpiBox">
        <div class="kpiLabel">System Signals</div>
        <div class="kpiValue" id="kpiValid">0</div>
      </div>
      <div class="kpiBox">
        <div class="kpiLabel">Market Health</div>
        <div class="kpiValue" style="color: var(--success); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px;" id="dataAge">Optimal</div>
      </div>
    </div>

    <section class="controls">
      <div class="field">
        <label>View Perspective</label>
        <select id="viewMode">
          <option value="all">Full List</option>
          <option value="recommended">Institutional Recommended</option>
          <option value="valid">Valid Setups Only</option>
        </select>
      </div>
      <div class="field">
        <label>Strategy Filter</label>
        <select id="strategyFilter">
          <option value="all">All Modules</option>
        </select>
      </div>
      <div class="field" style="grid-column: span 2;">
        <label>Portfolio Context (A$)</label>
        <input id="portfolio" placeholder="100000" type="number" />
      </div>
      <div class="field">
        <label>Risk Constraint</label>
        <select id="riskPct">
          <option value="0.5">0.5% Floor</option>
          <option value="1" selected>1.0% Standard</option>
          <option value="2">2.0% Aggressive</option>
        </select>
      </div>
    </section>

    <div id="tables">
      </div>

    <footer style="margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--border); text-align: center;">
      <p style="font-size: 0.8rem; color: var(--text-muted); max-width: 600px; margin: 0 auto;">
        <b>Warning:</b> Modelled outputs are based on end-of-day data. Order types (Limit/Stop-Limit) are mandatory for risk management. Not financial advice.
      </p>
    </footer>
  </main>

  <script>
    const DATA_URL = "/public/today.json";

    // Persist UI preferences
    const prefs = { view:"all", strat:"all", q:"", sort:"status_score", portfolio:100000, riskPct:1 };

    function clamp(n, lo, hi){
      const x = Number(n);
      if (!Number.isFinite(x)) return lo;
      return Math.min(hi, Math.max(lo, x));
    }

    function readMoneyLike(s){
      const raw = String(s ?? "").replace(/[^0-9.\-]/g, "");
      if (!raw) return null;
      const x = Number(raw);
      return Number.isFinite(x) ? x : null;
    }

    function loadPrefs(){
      try{
        const raw = localStorage.getItem("itradelite_today_prefs");
        if (!raw) return;
        const obj = JSON.parse(raw);
        Object.assign(prefs, obj || {});
      }catch(_){}
      // normalize
      prefs.portfolio = clamp(prefs.portfolio ?? 100000, 1000, 100000000);
      prefs.riskPct = clamp(prefs.riskPct ?? 1, 0.25, 3);
    }

    function savePrefs(){
      try{ localStorage.setItem("itradelite_today_prefs", JSON.stringify(prefs)); }catch(_){}
    }

    function fmt(n, digits=2){
      if (n === null || n === undefined || n === "") return "—";
      const x = Number(n);
      if (!Number.isFinite(x)) return String(n);
      return x.toFixed(digits);
    }

    function safeText(s){ return (s === null || s === undefined) ? "—" : String(s); }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function showError(msg){
      const box = document.getElementById("errorBox");
      if (!box) return;
      box.textContent = msg;
      box.style.display = "block";
      setStatus(false, "Error");
    }
    function clearError(){
      const box = document.getElementById("errorBox");
      if (!box) return;
      box.style.display = "none";
      box.textContent = "";
    }

    function setStatus(ok, text){
      const statusText = document.getElementById("statusText");
      const chip = document.getElementById("statusChip");
      if (statusText) statusText.textContent = text;

      if (chip){
        chip.style.borderColor = ok ? "rgba(16,185,129,.35)" : "rgba(245,158,11,.35)";
        chip.style.background  = ok ? "rgba(16,185,129,.10)" : "rgba(245,158,11,.10)";
      }
    }

    function computeDataAge(generatedAtUtc){
      if (!generatedAtUtc) return "—";
      const d = new Date(generatedAtUtc);
      if (isNaN(d.getTime())) return "—";
      const now = new Date();
      const mins = Math.round((now - d) / 60000);
      if (!isFinite(mins)) return "—";
      if (mins < 90) return mins + " min";
      return (mins / 60).toFixed(1) + " hrs";
    }

    function parseEntry(r){
      if (r.entry_text) return r.entry_text;
      if (r.entry !== null && r.entry !== undefined && r.entry !== "") return fmt(r.entry, 4);
      return "—";
    }
    function parseLastClose(r){
      if (r.last_close === null || r.last_close === undefined || r.last_close === "") return "—";
      const x = Number(r.last_close);
      if (!Number.isFinite(x)) return "—";
      return fmt(x, 4);
    }

    function statusPill(status){
      if (status === "Valid") return `<span><span class="status-dot dot--valid"></span>Valid</span>`;
      if (status === "Watch") return `<span><span class="status-dot dot--watch"></span>Watch</span>`;
      return `<span class="muted">—</span>`;
    }

    function normalizeStrategyName(s){
      return (s || "").trim();
    }

    function scoreVal(r){
      const x = Number(r.score);
      return Number.isFinite(x) ? x : -1;
    }

    // --- Parse "trigger=... limit=..." from STOP-LIMIT entry text ---
    function parseStopLimitEntryText(entryText){
      const s = String(entryText || "").trim();
      if (!s) return null;

      // Explicit skip => no sizing
      if (/^SKIP\b/i.test(s) || s.toUpperCase().includes("SKIP")) return { skip: true };

      let trigger = null;
      let limit = null;

      try{
        const mTrig = s.match(/trigger\s*=\s*([0-9]*\.?[0-9]+)/i);
        const mLim  = s.match(/limit\s*=\s*([0-9]*\.?[0-9]+)/i);
        if (mTrig) trigger = Number(mTrig[1]);
        if (mLim)  limit   = Number(mLim[1]);
      }catch(_){}

      if (!Number.isFinite(trigger)) trigger = null;
      if (!Number.isFinite(limit))   limit = null;

      if (trigger === null && limit === null) return null;
      return { trigger, limit, skip: false };
    }

    // Choose a numeric entry for sizing:
    // - direct numeric entry (LIMIT strategies)
    // - else STOP-LIMIT parse => use LIMIT (worst-case fill), else TRIGGER
    function numericEntryForSizing(r){
      const direct = Number(r.entry);
      if (Number.isFinite(direct)) return direct;

      const entryText = (r.entry_text !== undefined && r.entry_text !== null)
        ? r.entry_text
        : r.entry;

      const parsed = parseStopLimitEntryText(entryText);
      if (!parsed || parsed.skip) return null;

      if (parsed.limit !== null) return parsed.limit;
      if (parsed.trigger !== null) return parsed.trigger;

      return null;
    }

    // --- Institutional display helpers (prefer scan.py fields) ---
    function numOrNull(x){
      const n = Number(x);
      return Number.isFinite(n) ? n : null;
    }

    function displayTp1(r){
      // Prefer ATR target from scan output (tp1), else compute fallback from ATR if possible.
      const t = numOrNull(r.tp1);
      if (t !== null) return t;

      const atr = numOrNull(r.atr14);
      const entry = numericEntryForSizing(r);
      if (atr !== null && entry !== null) return entry + 1.5 * atr;
      return null;
    }

    function displayCapTarget(r){
      // Prefer scan output cap_target
      const c = numOrNull(r.cap_target);
      if (c !== null) return c;

      // fallback: min(tp2, ceiling) if available
      const tp2 = displayTp2(r);
      const ceil = numOrNull(r.ceiling);
      if (tp2 !== null && ceil !== null) return Math.min(tp2, ceil);
      if (tp2 !== null) return tp2;
      return null;
    }

    function displayTp2(r){
      // Prefer ATR target from scan output (tp2), else compute fallback from ATR if possible.
      const t = numOrNull(r.tp2);
      if (t !== null) return t;

      const atr = numOrNull(r.atr14);
      const entry = numericEntryForSizing(r);
      if (atr !== null && entry !== null) return entry + 3.0 * atr;
      return null;
    }

    function displayRmult(r){
      const x = numOrNull(r.r_mult);
      return x;
    }

    function sizingForRow(r){
      const entry = numericEntryForSizing(r);
      const stop  = Number(r.stop);

      if (!Number.isFinite(entry) || !Number.isFinite(stop)) return null;

      const riskPerShare = Math.abs(entry - stop);
      if (!Number.isFinite(riskPerShare) || riskPerShare <= 0) return null;

      const portfolio = clamp(prefs.portfolio, 1000, 100000000);
      const riskPct = clamp(prefs.riskPct, 0.25, 3);
      const riskBudget = portfolio * (riskPct / 100);

      const qty = Math.floor(riskBudget / riskPerShare);
      if (!Number.isFinite(qty) || qty <= 0) {
        return { qty: 0, riskBudget, riskPerShare, entryUsed: entry };
      }

      return { qty, riskBudget, riskPerShare, entryUsed: entry };
    }

    // --- NEW: "Risk (A$)" for sorting + display is user risk budget per row (sizing truth = UI) ---
    function riskBudgetForRow(r){
      const s = sizingForRow(r);
      if (!s) return null;
      return s.riskBudget;
    }

    function rawRiskVal(r){
      const rb = riskBudgetForRow(r);
      return (rb !== null) ? rb : -1;
    }

    function buildTable(title, rows, subtitle){
      const count = rows.length;

      let html = `
        <section class="card card--pad">
          <div class="sectionTitle">
            <h2>${escapeHtml(title)}</h2>
            <div class="count">${escapeHtml(subtitle || (count + " item(s)"))}</div>
          </div>
          <div class="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>Symbol</th>
                  <th style="width:160px;">Strategy</th>
                  <th>Entry</th>
                  <th style="width:110px;">Last close</th>
                  <th style="width:110px;">Stop</th>
                  <th style="width:90px;">Qty</th>
                  <th style="width:120px;">Risk (A$)</th>
                  <th style="width:120px;">TP1 (ATR)</th>
                  <th style="width:130px;">Cap Target</th>
                  <th style="width:110px;">R mult</th>
                  <th style="width:90px;">Status</th>
                </tr>
              </thead>
              <tbody>
      `;

      for (const r of rows){
        const sym = escapeHtml(safeText(r.symbol));
        const strat = escapeHtml(normalizeStrategyName(r.strategy));
        const entryTxt = escapeHtml(parseEntry(r));
        const lastClose = escapeHtml(parseLastClose(r));
        const stopTxt = escapeHtml(fmt(r.stop, 4));
        const pill = statusPill(r.status);

        const s = sizingForRow(r);
        const qtyTxt = s ? (s.qty > 0 ? String(s.qty) : "—") : "—";
        const riskBudgetTxt = s ? ("~" + Math.round(s.riskBudget).toString()) : "—";

        const tp1 = displayTp1(r);
        const cap = displayCapTarget(r);
        const rmult = displayRmult(r);

        const tp1Txt = (tp1 !== null) ? fmt(tp1, 4) : "—";
        const capTxt = (cap !== null) ? fmt(cap, 4) : "—";
        const rmultTxt = (rmult !== null) ? fmt(rmult, 2) : "—";

        const note = r.plain_english || r.instruction || r.note || "";
        const noteHtml = note 
          ? `<tr class="note-row"><td colspan="11">${escapeHtml(note)}</td></tr>`
          : "";

        html += `
          <tr>
            <td class="mono symbol-cell">${sym}</td>
            <td>${strat || "—"}</td>
            <td class="mono">${entryTxt}</td>
            <td class="mono">${lastClose}</td>
            <td class="mono">${stopTxt}</td>
            <td class="mono">${escapeHtml(qtyTxt)}</td>
            <td class="mono">${escapeHtml(riskBudgetTxt)}</td>
            <td class="mono">${escapeHtml(tp1Txt)}</td>
            <td class="mono">${escapeHtml(capTxt)}</td>
            <td class="mono">${escapeHtml(rmultTxt)}</td>
            <td>${pill}</td>
          </tr>
          ${noteHtml}
        `;
      }

      html += `
              </tbody>
            </table>
          </div>
        </section>
      `;
      return html;
    }

    function hydrateStrategyOptions(allRows){
      const sel = document.getElementById("strategyFilter");
      if (!sel) return;
      const existing = new Set([...sel.options].map(o => o.value));
      const strategies = new Set(allRows.map(s => normalizeStrategyName(s.strategy)).filter(Boolean));
      const sorted = [...strategies].sort((a,b)=>a.localeCompare(b));
      for (const s of sorted){
        if (existing.has(s)) continue;
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        sel.appendChild(opt);
      }
    }

    function applyFilters(rows){
      let out = rows.slice();

      if (prefs.strat !== "all"){
        out = out.filter(r => normalizeStrategyName(r.strategy) === prefs.strat);
      }
      if (prefs.q){
        const q = prefs.q.toUpperCase();
        out = out.filter(r => String(r.symbol || "").toUpperCase().includes(q));
      }

      const statusRank = (st) => st === "Valid" ? 2 : (st === "Watch" ? 1 : 0);

      out.sort((a,b)=>{
        if (prefs.sort === "symbol_asc") return String(a.symbol||"").localeCompare(String(b.symbol||""));

        if (prefs.sort === "risk_desc") {
          // Sort by USER risk budget (A$) descending (truth = UI sizing)
          return rawRiskVal(b) - rawRiskVal(a);
        }

        if (prefs.sort === "r_mult_desc") {
          const ra = displayRmult(a);
          const rb = displayRmult(b);
          const va = (ra === null) ? -1 : ra;
          const vb = (rb === null) ? -1 : rb;
          return vb - va;
        }

        if (prefs.sort === "score_desc") return scoreVal(b) - scoreVal(a);

        const ds = statusRank(b.status) - statusRank(a.status);
        if (ds !== 0) return ds;
        return scoreVal(b) - scoreVal(a);
      });

      return out;
    }

    function renderBanners(data){
      // NEVER render risk banner
      const rb = document.getElementById("riskBanner");
      if (rb) rb.innerHTML = "";

      // Freshness banner only
      const fb = document.getElementById("freshBanner");
      if (!fb) return;

      if (data.data_fresh === false){
        fb.innerHTML = `
          <div class="banner banner--stale">
            <div>
              <b>Data freshness:</b> Yahoo daily bars not updated yet. Recommendations may be suppressed.
              <div class="small" style="margin-top:4px;">Safety gate to avoid publishing stale signals.</div>
            </div>
            <div class="pill">STALE</div>
          </div>
        `;
      } else {
        fb.innerHTML = "";
      }
    }

    function extractRecommendedRows(data){
      if (Array.isArray(data.recommended_orders)) return data.recommended_orders;
      const setups = Array.isArray(data.setups) ? data.setups : [];
      return setups.filter(r => r.status === "Valid");
    }

    function render(data){
      clearError();

      document.getElementById("generated").textContent = safeText(data.generated || data.date);
      document.getElementById("validFor").textContent  = safeText(data.valid_for || data.date);
      document.getElementById("riskMode").textContent  = safeText((data.risk_mode || "—").replaceAll("_"," "));
      document.getElementById("dataAge").textContent   = computeDataAge(data.generated_at_utc);

      const setups = Array.isArray(data.setups) ? data.setups : [];
      const recommended = extractRecommendedRows(data);

      const validCount = setups.filter(s => s.status === "Valid").length;
      document.getElementById("kpiRecommended").textContent = String(recommended.length);
      document.getElementById("kpiValid").textContent = String(validCount);

      // Legacy IDs (still shown in pills)
      document.getElementById("kpiUniverse").textContent = safeText(data.universe_size || "—");
      document.getElementById("kpiAxjo").textContent = safeText(data.axjo_last_bar || "—");

      renderBanners(data);
      setStatus(true, data.published === false ? "Not published" : "Loaded");

      hydrateStrategyOptions(setups.concat(recommended));

      const filteredSetups = applyFilters(setups);
      const filteredRecommended = applyFilters(recommended);

      const validRows = filteredSetups.filter(r => r.status === "Valid");
      const watchRows = filteredSetups.filter(r => r.status === "Watch");

      let html = "";

      if (prefs.view === "recommended"){
        if (filteredRecommended.length){
          html += buildTable("Recommended Orders", filteredRecommended, "Actionable (diversified picks)");
        } else {
          html += `<section class="card card--pad"><div class="sectionTitle"><h2>Recommended Orders</h2><div class="count">0 item(s)</div></div><div style="padding:16px 18px;" class="small"><b>No recommended orders today.</b><div>Either the freshness gate suppressed publishing or no setups passed the final selection.</div></div></section>`;
        }
      }
      else if (prefs.view === "valid"){
        if (validRows.length) html += buildTable("Valid Setups", validRows, validRows.length + " item(s)");
        else html += `<section class="card card--pad"><div class="sectionTitle"><h2>Valid Setups</h2><div class="count">0 item(s)</div></div><div style="padding:16px 18px;" class="small"><b>No valid setups match your filters.</b><div>Try changing Strategy or clearing the search.</div></div></section>`;
      }
      else if (prefs.view === "watch"){
        if (watchRows.length) html += buildTable("Watchlist", watchRows, watchRows.length + " item(s)");
        else html += `<section class="card card--pad"><div class="sectionTitle"><h2>Watchlist</h2><div class="count">0 item(s)</div></div><div style="padding:16px 18px;" class="small"><b>No watch items match your filters.</b><div>Try changing Strategy or clearing the search.</div></div></section>`;
      }
      else {
        if (filteredRecommended.length){
          html += buildTable("Recommended Orders", filteredRecommended, "Actionable (diversified picks)");
        } else {
          html += `<section class="card card--pad"><div class="sectionTitle"><h2>Recommended Orders</h2><div class="count">0 item(s)</div></div><div style="padding:16px 18px;" class="small">No recommended orders published today (freshness gate or no setups passed final selection).</div></section>`;
        }

        if (validRows.length) html += buildTable("Valid Setups", validRows, validRows.length + " item(s)");
        if (watchRows.length) html += buildTable("Watchlist", watchRows, watchRows.length + " item(s)");

        if (!filteredRecommended.length && !validRows.length && !watchRows.length){
          html += `<section class="card card--pad"><div class="sectionTitle"><h2>No Results</h2><div class="count">—</div></div><div style="padding:16px 18px;" class="small"><b>No rows match your filters.</b><div>Try changing View/Strategy or clearing search.</div></div></section>`;
        }
      }

      document.getElementById("tables").innerHTML = html;
    }

    async function load(){
      setStatus(false, "Loading…");
      const url = DATA_URL + "?v=" + Date.now();
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }

    function bindControls(){
      const viewMode = document.getElementById("viewMode");
      const strategyFilter = document.getElementById("strategyFilter");
      const q = document.getElementById("q");
      const sortBy = document.getElementById("sortBy");
      const portfolio = document.getElementById("portfolio");
      const riskPct = document.getElementById("riskPct");

      viewMode.value = prefs.view;
      strategyFilter.value = prefs.strat;
      q.value = prefs.q;
      sortBy.value = prefs.sort;

      // sizing fields
      portfolio.value = String(prefs.portfolio ?? 100000);
      // match select option if possible
      const rp = String(prefs.riskPct ?? 1);
      if ([...riskPct.options].some(o => o.value === rp)) riskPct.value = rp;

      function onChange(){
        prefs.view = viewMode.value;
        prefs.strat = strategyFilter.value;
        prefs.q = q.value.trim();
        prefs.sort = sortBy.value;

        // sizing
        const p = readMoneyLike(portfolio.value);
        prefs.portfolio = clamp(p ?? 100000, 1000, 100000000);
        prefs.riskPct = clamp(Number(riskPct.value), 0.25, 3);

        savePrefs();
        if (window.__DATA__) render(window.__DATA__);
      }

      viewMode.addEventListener("change", onChange);
      strategyFilter.addEventListener("change", onChange);
      sortBy.addEventListener("change", onChange);
      q.addEventListener("input", onChange);

      portfolio.addEventListener("input", onChange);
      riskPct.addEventListener("change", onChange);

      document.getElementById("refreshBtn").addEventListener("click", async ()=>{
        try{
          const data = await load();
          window.__DATA__ = data;
          render(data);
        }catch(e){
          showError("Failed to load /public/today.json. (" + e.message + ")");
          console.error(e);
        }
      });

      document.getElementById("copyLinkBtn").addEventListener("click", async ()=>{
        const link = location.origin + DATA_URL;
        try{
          await navigator.clipboard.writeText(link);
          alert("Copied: " + link);
        }catch(_){
          prompt("Copy this URL:", link);
        }
      });
    }

    (async function(){
      loadPrefs();
      bindControls();

      try{
        const data = await load();
        window.__DATA__ = data;
        render(data);
      }catch(e){
        showError("Failed to load /public/today.json. (" + e.message + ")");
        console.error(e);
      }
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Today — iTradeLite Institutional Daily Briefing</title>

<meta name="description" content="Daily ASX trading briefing generated by a transparent rule-based system. Includes recommended orders, watchlist, risk regime and data freshness status."/>

<link rel="stylesheet" href="/assets/site.css?v=3"/>

<style>
.pagePad{ padding:20px 0 48px; }

.banner{
  padding:12px 16px;
  border-radius:10px;
  margin-bottom:16px;
  font-size:14px;
}
.banner--riskon{
  background:rgba(94,234,212,.08);
  border:1px solid rgba(94,234,212,.25);
}
.banner--riskoff{
  background:rgba(255,120,120,.08);
  border:1px solid rgba(255,120,120,.25);
}
.banner--stale{
  background:rgba(255,213,128,.08);
  border:1px solid rgba(255,213,128,.25);
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:8px 10px;
  border-bottom:1px solid rgba(255,255,255,.05);
  text-align:left;
}

th{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.6px;
  color:rgba(255,255,255,.6);
}

.pill{
  padding:3px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:600;
}
.pill--valid{
  background:rgba(94,234,212,.15);
  color:#5eead4;
}
.pill--watch{
  background:rgba(255,213,128,.15);
  color:#ffd580;
}
.pill--riskon{
  background:rgba(94,234,212,.2);
  color:#5eead4;
}
.pill--riskoff{
  background:rgba(255,120,120,.2);
  color:#ff7878;
}

.mono{ font-family:monospace; }
.small{ font-size:13px; opacity:.8; }

.kpiGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
  margin-top:16px;
}

.kpiBox{
  background:rgba(255,255,255,.03);
  padding:12px;
  border-radius:10px;
}

.kpiLabel{ font-size:12px; opacity:.6; }
.kpiValue{ font-size:20px; font-weight:600; margin-top:4px; }
</style>
</head>

<body>

<div class="topbar">
  <div class="container topbar__inner">
    <a class="brand" href="/">
      <span class="brand__name">iTradeLite</span>
    </a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/today/" aria-current="page">Today</a>
      <a href="/how-it-works.html">How it works</a>
      <a href="/about.html">About</a>
    </nav>
  </div>
</div>

<main class="container pagePad">

<div id="riskBanner"></div>
<div id="freshBanner"></div>

<section class="card card--pad">

<div class="sectionTitle">
  <h2>Daily Briefing</h2>
  <div class="small mono" id="generatedText">Loading…</div>
</div>

<div class="kpiGrid">
  <div class="kpiBox">
    <div class="kpiLabel">Recommended Orders</div>
    <div class="kpiValue" id="kpiRecommended">—</div>
  </div>
  <div class="kpiBox">
    <div class="kpiLabel">Watchlist Items</div>
    <div class="kpiValue" id="kpiWatchlist">—</div>
  </div>
  <div class="kpiBox">
    <div class="kpiLabel">Universe Size</div>
    <div class="kpiValue" id="kpiUniverse">—</div>
  </div>
  <div class="kpiBox">
    <div class="kpiLabel">AXJO Last Bar</div>
    <div class="kpiValue" id="kpiAxjo">—</div>
  </div>
</div>

</section>

<div id="recommendedSection"></div>
<div id="watchlistSection"></div>

<div class="small" style="margin-top:24px;">
Educational content only. Not financial advice. System is rule-based and transparent.
</div>

</main>

<script>
const DATA_URL = "/public/today.json";

function fmt(n,d=2){
  if(n===null||n===undefined||n==="") return "—";
  const x=Number(n);
  if(!isFinite(x)) return n;
  return x.toFixed(d);
}

function buildTable(title,rows,type){
  if(!rows||rows.length===0) return "";

  const pillClass = type==="valid" ? "pill--valid" : "pill--watch";

  let html=`
  <section class="card card--pad">
    <div class="sectionTitle">
      <h2>${title}</h2>
      <div class="small">${rows.length} item(s)</div>
    </div>
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Strategy</th>
            <th>Entry</th>
            <th>Stop</th>
            <th>Risk (A$)</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
  `;

  for(const r of rows){
    html+=`
    <tr>
      <td class="mono"><b>${r.symbol||"—"}</b></td>
      <td>${r.strategy||"—"}</td>
      <td class="mono">${r.entry_text||fmt(r.entry,4)}</td>
      <td class="mono">${fmt(r.stop,2)}</td>
      <td class="mono">${r.risk? "~"+Math.round(r.risk):"—"}</td>
      <td><span class="pill ${pillClass}">${title}</span></td>
    </tr>
    `;
  }

  html+=`
        </tbody>
      </table>
    </div>
  </section>
  `;

  return html;
}

function render(data){

  document.getElementById("generatedText").textContent =
    "Generated: "+(data.generated||"—")+" | Valid for: "+(data.valid_for||"—");

  document.getElementById("kpiUniverse").textContent = data.universe_size||"—";
  document.getElementById("kpiAxjo").textContent = data.axjo_last_bar||"—";

  const rec = data.recommended_orders||[];
  const watch = (data.setups||[]);

  document.getElementById("kpiRecommended").textContent = rec.length;
  document.getElementById("kpiWatchlist").textContent = watch.length;

  // Risk regime banner
  const rb=document.getElementById("riskBanner");
  if(data.risk_mode==="risk_on"){
    rb.innerHTML=`<div class="banner banner--riskon">
      <b>Risk Regime:</b> RISK-ON &nbsp;
      <span class="pill pill--riskon">System allows trend + momentum entries</span>
    </div>`;
  }else{
    rb.innerHTML=`<div class="banner banner--riskoff">
      <b>Risk Regime:</b> RISK-OFF &nbsp;
      <span class="pill pill--riskoff">Only defensive setups allowed</span>
    </div>`;
  }

  // Data freshness banner
  const fb=document.getElementById("freshBanner");
  if(data.data_fresh===false){
    fb.innerHTML=`<div class="banner banner--stale">
      Market data not fully updated. Recommendations suppressed.
    </div>`;
  }else{
    fb.innerHTML="";
  }

  // Recommended first (institutional priority)
  document.getElementById("recommendedSection").innerHTML =
    buildTable("Recommended Orders",rec,"valid");

  document.getElementById("watchlistSection").innerHTML =
    buildTable("Watchlist",watch,"watch");
}

async function load(){
  const r=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}

(async function(){
  try{
    const data=await load();
    render(data);
  }catch(e){
    console.error(e);
    document.getElementById("recommendedSection").innerHTML =
      `<div class="banner banner--stale">Failed to load today.json</div>`;
  }
})();
</script>

</body>
</html>

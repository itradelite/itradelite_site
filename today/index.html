<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iTradeLite — Today</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { margin-bottom: 6px; }
    .sub { color: #555; margin-top: 0; }
    .assump { margin: 10px 0 0 0; color: #666; font-size: 12px; }
    table { border-collapse: collapse; width: 100%; margin-top: 18px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f6f6f6; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; }
    .valid { background: #e8f5e9; }
    .watch { background: #fff8e1; }
    .footer { margin-top: 22px; color: #777; font-size: 12px; line-height: 1.4; }

    /* Inline info badge */
    .info {
      display: inline-block;
      margin-left: 6px;
      padding: 0 6px;
      border: 1px solid #aaa;
      border-radius: 999px;
      font-size: 11px;
      color: #444;
      cursor: pointer;
      user-select: none;
    }
    .info[aria-expanded="true"] { background: #f0f0f0; }
    .hint {
      display: none;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #ddd;
      background: #fafafa;
      color: #555;
      font-size: 12px;
      border-radius: 6px;
    }
    .hint.show { display: block; }
  </style>
</head>
<body>
  <h1>Today’s trading decision</h1>
  <p class="sub">Rule-based. Same list for everyone.</p>

  <div id="content">Loading…</div>

  <p class="footer">
    Educational, rule-based output. No financial advice.
  </p>

  <script>
    function fmt(n) {
      if (n === null || n === undefined || n === "") return "—";
      const x = Number(n);
      if (!Number.isFinite(x)) return String(n);
      return x.toFixed(2);
    }

    function metaLine(data) {
      const generated = data.generated || data.date || "—";
      const validFor  = data.valid_for || data.date || "—";
      const riskMode  = data.risk_mode || "—";

      // Visible assumptions line (can’t miss it)
      const assumptions =
        `<p class="assump"><b>Model assumptions:</b> “Risk (A$)” uses a model portfolio of A$100,000 and 1% risk per trade; size derived from entry–stop distance and rounded to whole shares.</p>`;

      // Click-to-toggle detail block (mobile-safe)
      const riskInfo =
        `<span class="info" id="riskInfoBtn" role="button" tabindex="0" aria-expanded="false" title="Click for details">ⓘ</span>
         <div class="hint" id="riskHint">
           <b>Risk (A$)</b> is the estimated dollar risk if the stop is hit, using a <b>A$100,000</b> model portfolio and <b>1%</b> risk per trade.
           Position size is computed from the entry–stop distance and rounded to whole shares.
         </div>`;

      return `
        <p>Generated: <b>${generated}</b> • Valid for: <b>${validFor}</b> • Risk mode: <b>${riskMode}</b></p>
        ${assumptions}
        ${riskInfo}
      `;
    }

    function wireRiskInfoToggle() {
      const btn = document.getElementById("riskInfoBtn");
      const hint = document.getElementById("riskHint");
      if (!btn || !hint) return;

      function toggle() {
        const expanded = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", expanded ? "false" : "true");
        hint.classList.toggle("show", !expanded);
      }

      btn.addEventListener("click", toggle);
      btn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggle();
        }
      });
    }

    fetch("../public/today.json", { cache: "no-store" })
      .then(r => r.json())
      .then(data => {
        const setups = (data.setups || []);
        const valid = setups.filter(s => s.status === "Valid");
        const watch = setups.filter(s => s.status === "Watch");

        if (valid.length === 0) {
          document.getElementById("content").innerHTML =
            `<h2>No valid setups today.</h2>
             ${metaLine(data)}
             ${watch.length ? "<h3>Watchlist</h3>" : ""}`;

          if (watch.length) {
            document.getElementById("content").innerHTML += buildTable(watch, "Watch");
          }

          wireRiskInfoToggle();
          return;
        }

        let html = `${metaLine(data)}`;
        html += "<h2>Valid</h2>";
        html += buildTable(valid, "Valid");
        if (watch.length) {
          html += "<h2>Watch</h2>";
          html += buildTable(watch, "Watch");
        }
        document.getElementById("content").innerHTML = html;

        wireRiskInfoToggle();
      })
      .catch(err => {
        document.getElementById("content").textContent =
          "Failed to load today.json (check GitHub Pages paths).";
        console.error(err);
      });

    function buildTable(rows, label) {
      const cls = label === "Valid" ? "valid" : "watch";
      let t = `<table>
        <thead><tr>
          <th>Symbol</th><th>Setup</th><th>Entry</th><th>Stop</th><th>Risk (A$)</th><th>Status</th>
        </tr></thead><tbody>`;
      for (const r of rows) {
        t += `<tr>
          <td>${r.symbol || "—"}</td>
          <td>${r.strategy || "—"}</td>
          <td>${r.entry_text ? r.entry_text : fmt(r.entry)}</td>
          <td>${fmt(r.stop)}</td>
          <td>${r.risk ? "~" + Math.round(Number(r.risk)) : "—"}</td>
          <td><span class="pill ${cls}">${label}</span></td>
        </tr>`;
      }
      t += "</tbody></table>";
      return t;
    }
  </script>
</body>
</html>
